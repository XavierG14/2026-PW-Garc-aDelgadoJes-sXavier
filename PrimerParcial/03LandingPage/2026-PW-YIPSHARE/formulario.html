<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="./img/logo_StartUpIDEA.png">
  <title>Contacto - StartUP IDEA</title>
  <link rel="stylesheet" href="./CSS/style.css">
</head>
<body class="body1">

  <main>
    <header class="titulo-principal">
      <h2>
        <img src="./img/logo_STARTUP_IDEA.jpeg" alt="Logo" class="logo-titulo">
        StartUP IDEA
      </h2>
      <p>Contáctanos para más información</p>
    </header>

    <form class="formulario-registro" id="form-registro" novalidate>
      <h1 class="titulo-formulario">Contáctanos</h1>
      
      <div class="campo">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
        <span class="error" id="error-nombre"></span>
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
        <span class="error" id="error-correo"></span>
      </div>

      <div class="campo">
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
        <span class="error" id="error-mensaje"></span>
      </div>

      <button type="submit" id="boton-registrar">Enviar Mensaje</button>
      <p class="mensaje-exito" id="mensaje-exito"></p>
    </form>

    <div class="campo">
      <a href="index.html" class="boton">Volver al Inicio</a>
    </div>
  </main>

  <script src="./js/validaciones.js"></script>
</body>
</html>
